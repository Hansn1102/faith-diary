<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신앙일기</title>
<meta name="theme-color" content="#f4efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6; --sheet:#fbf8f2; --ink:#2a2622; --soft:#6f665c; --faint:#a89d8f;
  --rule:#e4dccf; --accent:#8a3b2a; --ok:#4d6b4a;
  --serif:"Gowun Batang", "Noto Serif KR", serif;
  --sans:"Pretendard", -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#1b1916; --sheet:#22201c; --ink:#ece5d8; --soft:#a99f91; --faint:#6e665b; --rule:#36322c; --accent:#d58a6f; --ok:#93b48f; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}

/* sidebar */
aside{border-right:1px solid var(--rule);padding:28px 20px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100dvh;overflow:auto}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--soft);letter-spacing:0;margin-top:2px}
.streak{font-size:13px;color:var(--soft)}
.streak b{color:var(--accent);font-weight:500}
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink);outline:none}
.search:focus{border-color:var(--soft)}
.list{display:flex;flex-direction:column;gap:2px;flex:1}
.list button{text-align:left;padding:9px 10px;border-radius:6px;display:block;width:100%}
.list button:hover{background:var(--sheet)}
.list button.on{background:var(--sheet);box-shadow:inset 2px 0 0 var(--accent)}
.list .d{font-size:12px;color:var(--soft)}
.list .t{font-family:var(--serif);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .empty{font-size:13px;color:var(--faint);padding:8px 10px}
.side-foot{display:flex;flex-direction:column;gap:6px;font-size:13px;border-top:1px solid var(--rule);padding-top:14px}
.side-foot button{text-align:left;color:var(--soft)}
.side-foot button:hover{color:var(--ink)}

/* main */
main{padding:40px 24px 120px;display:flex;justify-content:center}
.sheet{width:100%;max-width:680px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.datebox{display:flex;align-items:center;gap:10px}
.datebox h1{font-family:var(--serif);font-weight:700;font-size:30px;margin:0;letter-spacing:-.02em}
.nav{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);color:var(--soft);display:grid;place-items:center;font-size:14px}
.nav:hover{color:var(--ink);border-color:var(--soft)}
.status{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block}
.status.saved i{background:var(--ok)}
.status.saving i{background:var(--accent)}
#datePick{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.weekday{font-size:13px;color:var(--soft);margin-left:2px}

.field{margin-bottom:30px}
.field label{display:flex;align-items:baseline;gap:10px;font-size:12px;letter-spacing:.08em;color:var(--soft);margin-bottom:8px}
.field label span{color:var(--faint);letter-spacing:0}
.field input,.field textarea{width:100%;border:0;background:transparent;color:var(--ink);outline:none;resize:none;font-family:var(--serif);font-size:17px;line-height:1.85;padding:0}
.field input{border-bottom:1px solid var(--rule);padding-bottom:6px}
.field input:focus{border-color:var(--soft)}
.field textarea{min-height:56px;background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 1.85em;background-position:0 calc(1.85em - 1px)}
.verse textarea{font-size:19px;color:var(--accent)}
.verse-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.verse-row input{flex:1}
.shuffle{font-size:12px;color:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:3px 11px;white-space:nowrap}
.shuffle:hover{color:var(--ink);border-color:var(--soft)}
::placeholder{color:var(--faint);opacity:1}

.prayers{display:flex;flex-direction:column}
.p-row{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--rule);padding:6px 0}
.p-row input[type=checkbox]{appearance:none;width:16px;height:16px;border:1px solid var(--soft);border-radius:3px;margin-top:9px;flex:none;cursor:pointer}
.p-row input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--sheet)}
.p-row input[type=text]{border:0;padding:0}
.p-row.done input[type=text]{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--faint)}
.p-row .x{color:var(--faint);font-size:18px;line-height:1;margin-top:6px;visibility:hidden}
.p-row:hover .x,.p-row:focus-within .x{visibility:visible}
.p-add{font-size:13px;color:var(--soft);margin-top:10px;text-align:left}
.p-add:hover{color:var(--ink)}

.banner{border:1px solid var(--accent);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:24px;display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.show{display:flex}
.banner button{color:var(--accent);font-weight:500}
.note{font-size:12px;color:var(--faint);border-top:1px solid var(--rule);padding-top:14px;margin-top:40px;line-height:1.7}

/* snapshots modal */
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:22px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,16,12,.35)}
dialog h3{font-family:var(--serif);margin:0 0 12px;font-size:18px}
dialog ul{list-style:none;margin:0 0 16px;padding:0;max-height:50vh;overflow:auto}
dialog li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
dialog li button{color:var(--accent)}
dialog .close{color:var(--soft);font-size:13px}

.mtoggle{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,85vw);background:var(--paper);z-index:20;transform:translateX(-100%);transition:transform .2s ease;height:100dvh}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(20,16,12,.3)}
  .mtoggle{display:inline-block;font-size:13px;color:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;margin-bottom:18px}
  main{padding:20px 16px 100px}
  .datebox h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">신앙일기<small>말씀 · 묵상 · 감사 · 기도</small></div>
    <div class="streak" id="streak"></div>
    <input class="search" id="search" placeholder="일기 검색" autocomplete="off">
    <div class="list" id="list"></div>
    <div class="side-foot">
      <button id="btnFile">백업 파일 연결</button>
      <button id="btnExport">내보내기 (.json)</button>
      <button id="btnImport">가져오기</button>
      <button id="btnSnaps">복원 지점 보기</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </aside>

  <main>
    <div class="sheet">
      <button class="mtoggle" id="mtoggle">목록</button>
      <div class="banner" id="banner"><span id="bannerText"></span><button id="bannerBtn"></button></div>

      <div class="top">
        <div class="datebox">
          <button class="nav" id="prev" aria-label="이전 날">‹</button>
          <h1 id="title" role="button" tabindex="0" title="날짜 선택"></h1>
          <button class="nav" id="next" aria-label="다음 날">›</button>
          <input type="date" id="datePick">
        </div>
        <div class="status" id="status"><i></i><span>자동 저장</span></div>
      </div>

      <div class="field verse">
        <label>오늘의 말씀</label>
        <textarea data-k="verse" rows="1" placeholder="말씀을 불러오는 중…"></textarea>
        <div class="verse-row">
          <input data-k="ref" placeholder="" style="font-size:14px;font-family:var(--sans);color:var(--soft)">
          <button class="shuffle" id="shuffle">다른 말씀</button>
        </div>
      </div>
      <div class="field">
        <label>묵상 <span>말씀이 내게 하시는 이야기</span></label>
        <textarea data-k="meditation" rows="3" placeholder="오늘 이 말씀 앞에서…"></textarea>
      </div>
      <div class="field">
        <label>감사 <span>작은 것부터</span></label>
        <textarea data-k="thanks" rows="2" placeholder="감사한 일 세 가지"></textarea>
      </div>
      <div class="field">
        <label>기도제목 <span>응답되면 체크</span></label>
        <div class="prayers" id="prayers"></div>
        <button class="p-add" id="pAdd">+ 기도제목 추가</button>
      </div>
      <div class="field">
        <label>적용 · 결단</label>
        <textarea data-k="apply" rows="2" placeholder="오늘 하루 실천할 한 가지"></textarea>
      </div>

      <p class="note" id="note">
        글은 입력하는 즉시 이 브라우저에 저장됩니다. 같은 주소·같은 브라우저에서만 보이니, 사이트 데이터를 지우기 전이나 기기를 바꿀 땐 ‘내보내기’로 파일을 꼭 받아두세요. ‘백업 파일 연결’을 하면 쓸 때마다 컴퓨터의 파일에도 자동으로 저장됩니다(Chrome·Edge).
      </p>
    </div>
  </main>
</div>

<dialog id="snapDlg">
  <h3>복원 지점</h3>
  <ul id="snapList"></ul>
  <button class="close" id="snapClose">닫기</button>
</dialog>

<script>
(() => {
const KEY = 'faithDiary.v1';
const SNAP = 'faithDiary.snap.';      // + YYYY-MM-DD, 하루 1개, 최근 30개 유지
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const WD = ['일','월','화','수','목','금','토'];

function safeGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); return true; } catch { return false; } }

let db = { entries: {} };
try { const raw = safeGet(KEY); if (raw) db = JSON.parse(raw); } catch {}
if (!db.entries) db.entries = {};

let cur = today();
let q = '';

const isEmpty = e => !e || ((e.verseAuto || (!e.verse && !e.ref)) && !e.meditation && !e.thanks && !e.apply && !(e.prayers||[]).some(p => p.text));

// ---- 저장 ----
const status = $('#status');
function setStatus(state, text){ status.className = 'status ' + state; status.querySelector('span').textContent = text; }

function persist(){
  for (const k of Object.keys(db.entries)) if (k !== cur && !db.entries[k].verse && isEmpty(db.entries[k])) delete db.entries[k];
  db.updatedAt = Date.now();
  const json = JSON.stringify(db);
  const ok = safeSet(KEY, json);
  if (ok && Object.keys(db.entries).length) snapshot(json);
  const t = new Date();
  setStatus(ok ? 'saved' : '', ok ? `저장됨 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}` : '저장 실패 — 내보내기로 보관하세요');
  renderList();
  scheduleFileBackup(json);
}
let saveT;
function saveSoon(){ setStatus('saving', '저장 중…'); clearTimeout(saveT); saveT = setTimeout(persist, 250); }
function flush(){ if (saveT){ clearTimeout(saveT); saveT = null; persist(); } }
addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
addEventListener('pagehide', flush);
addEventListener('beforeunload', flush);

function snapshot(json){
  safeSet(SNAP + today(), json);
  const keys = snapKeys();
  keys.slice(30).forEach(k => { try { localStorage.removeItem(k); } catch {} });
}
function snapKeys(){
  const out = [];
  try { for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k.startsWith(SNAP)) out.push(k); } } catch {}
  return out.sort().reverse();
}

// ---- 편집 ----
const entry = () => db.entries[cur] || (db.entries[cur] = { verse:'', ref:'', meditation:'', thanks:'', apply:'', prayers:[] });

function autoGrow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
document.querySelectorAll('[data-k]').forEach(el => {
  el.addEventListener('input', () => { entry()[el.dataset.k] = el.value; if (el.dataset.k==='verse'||el.dataset.k==='ref') entry().verseAuto = false; if (el.tagName==='TEXTAREA') autoGrow(el); saveSoon(); });
});

function renderPrayers(){
  const box = $('#prayers'); box.innerHTML = '';
  const e = db.entries[cur];
  (e?.prayers || []).forEach((p, i) => {
    const row = document.createElement('div'); row.className = 'p-row' + (p.done ? ' done' : '');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!p.done;
    const tx = document.createElement('input'); tx.type = 'text'; tx.value = p.text; tx.placeholder = '기도제목';
    tx.style.cssText = 'flex:1;font-family:var(--serif);font-size:17px;line-height:1.85;background:transparent;color:var(--ink);outline:none';
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label','삭제');
    cb.onchange = () => { entry().prayers[i].done = cb.checked; row.classList.toggle('done', cb.checked); saveSoon(); };
    tx.oninput = () => { entry().prayers[i].text = tx.value; saveSoon(); };
    tx.onkeydown = ev => { if (ev.key==='Enter' && !ev.isComposing){ ev.preventDefault(); addPrayer(i+1); } };
    x.onclick = () => { entry().prayers.splice(i,1); renderPrayers(); saveSoon(); };
    row.append(cb, tx, x); box.append(row);
  });
}
function addPrayer(at){
  const e = entry(); at = at ?? e.prayers.length;
  e.prayers.splice(at, 0, { text:'', done:false });
  renderPrayers();
  box_focus(at);
}
function box_focus(i){ const r = $('#prayers').children[i]; r && r.querySelector('input[type=text]').focus(); }
$('#pAdd').onclick = () => addPrayer();

function load(date){
  flush();
  cur = date;
  const e = db.entries[cur] || {};
  document.querySelectorAll('[data-k]').forEach(el => { el.value = e[el.dataset.k] || ''; if (el.tagName==='TEXTAREA') autoGrow(el); });
  renderPrayers();
  if (!e.verse && !e.ref) fillVerse(cur, false);
  const d = new Date(cur + 'T00:00:00');
  $('#title').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일<span class="weekday"> ${WD[d.getDay()]}요일${cur===today()?' · 오늘':''}</span>`;
  $('#datePick').value = cur;
  renderList();
}
const shift = n => { const d = new Date(cur + 'T00:00:00'); d.setDate(d.getDate()+n); load(ymd(d)); };
$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
const openPicker = () => { const p = $('#datePick'); p.showPicker ? p.showPicker() : p.click(); };
$('#title').onclick = openPicker;
$('#title').onkeydown = e => { if (e.key==='Enter') openPicker(); };
$('#datePick').onchange = e => e.target.value && load(e.target.value);

// ---- 오늘의 말씀 (개역한글 전체 31,103구절 중 무작위) ----
let bibleIdx = null; const bookCache = {};
async function getIdx(){ return bibleIdx || (bibleIdx = await fetch('bible/index.json').then(r => r.json())); }
async function getBook(i){ return bookCache[i] || (bookCache[i] = await fetch(`bible/${i}.json`).then(r => r.json())); }
function seeded(str){ let h = 2166136261; for (const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
async function fillVerse(date, random){
  try {
    const idx = await getIdx();
    const total = idx.reduce((a, [, ch]) => a + ch.reduce((x, y) => x + y, 0), 0);
    let n = Math.floor((random ? Math.random() : seeded(date)) * total);
    let b = 0, c = 0;
    outer: for (; b < idx.length; b++) for (c = 0; c < idx[b][1].length; c++) { if (n < idx[b][1][c]) break outer; n -= idx[b][1][c]; }
    const text = (await getBook(b))[c][n];
    if (date !== cur) return;
    const e = entry();
    if (!random && (e.verse || e.ref)) return;            // 직접 쓴 말씀은 절대 덮어쓰지 않음
    e.verse = text; e.ref = `${idx[b][0]} ${c+1}:${n+1}`; e.verseAuto = true;
    const vt = document.querySelector('[data-k=verse]'); vt.value = e.verse; autoGrow(vt);
    document.querySelector('[data-k=ref]').value = e.ref;
    saveSoon();
  } catch { document.querySelector('[data-k=verse]').placeholder = '말씀을 불러오지 못했어요. 직접 적어도 됩니다.'; }
}
$('#shuffle').onclick = () => {
  const e = db.entries[cur];
  if (e && e.verse && !e.verseAuto && !confirm('직접 적은 말씀을 다른 말씀으로 바꿀까요?')) return;
  fillVerse(cur, true);
};

// ---- 목록 ----
function renderList(){
  const list = $('#list'); list.innerHTML = '';
  const keys = Object.keys(db.entries).filter(k => !isEmpty(db.entries[k]));
  if (!keys.includes(cur)) keys.push(cur);
  keys.sort().reverse();
  const shown = keys.filter(k => {
    if (!q) return true;
    const e = db.entries[k]; if (!e) return false;
    return [e.verse,e.ref,e.meditation,e.thanks,e.apply,...(e.prayers||[]).map(p=>p.text)].join(' ').toLowerCase().includes(q);
  });
  if (!shown.length){ list.innerHTML = '<div class="empty">찾는 일기가 없어요</div>'; }
  shown.forEach(k => {
    const e = db.entries[k] || {};
    const d = new Date(k + 'T00:00:00');
    const b = document.createElement('button'); if (k===cur) b.className = 'on';
    const head = (e.meditation||'').split('\n').find(l => l.trim()) || '아직 묵상 전';
    b.innerHTML = `<div class="d">${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${WD[d.getDay()]})</div><div class="t"></div>`;
    b.querySelector('.t').textContent = head;
    b.onclick = () => { load(k); $('#side').classList.remove('open'); };
    list.append(b);
  });
  // 연속 기록
  let n = 0; const d = new Date();
  if (isEmpty(db.entries[ymd(d)])) d.setDate(d.getDate()-1);
  while (!isEmpty(db.entries[ymd(d)])) { n++; d.setDate(d.getDate()-1); }
  const total = Object.values(db.entries).filter(e => !isEmpty(e)).length;
  $('#streak').innerHTML = total ? `<b>${n}일</b> 연속 · 총 ${total}편` : '첫 일기를 적어보세요';
}
$('#search').oninput = e => { q = e.target.value.trim().toLowerCase(); renderList(); };
$('#mtoggle').onclick = () => $('#side').classList.add('open');
document.addEventListener('click', e => { const s = $('#side'); if (s.classList.contains('open') && !s.contains(e.target) && e.target.id!=='mtoggle') s.classList.remove('open'); });

// ---- 내보내기/가져오기 ----
$('#btnExport').onclick = () => {
  flush();
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `신앙일기-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#btnImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.entries) throw 0;
    // 병합: 같은 날짜는 더 긴 쪽 유지
    for (const [k, v] of Object.entries(data.entries)) {
      const mine = db.entries[k];
      if (!mine || JSON.stringify(v).length > JSON.stringify(mine).length) db.entries[k] = v;
    }
    persist(); load(cur); showBanner(`${Object.keys(data.entries).length}편을 가져왔어요.`);
  } catch { showBanner('파일을 읽지 못했어요. 신앙일기 .json 파일인지 확인해주세요.'); }
  e.target.value = '';
};

// ---- 복원 지점 ----
function restoreFrom(k){
  try { const d = JSON.parse(safeGet(k)); if (d && d.entries){ db = d; persist(); load(cur); return true; } } catch {}
  return false;
}
$('#btnSnaps').onclick = () => {
  const ul = $('#snapList'); ul.innerHTML = '';
  const keys = snapKeys();
  if (!keys.length) ul.innerHTML = '<li>아직 복원 지점이 없어요</li>';
  keys.forEach(k => {
    let n = 0; try { n = Object.keys(JSON.parse(safeGet(k)).entries).length; } catch {}
    const li = document.createElement('li');
    li.innerHTML = `<span>${k.slice(SNAP.length)} 기준 · ${n}편</span>`;
    const b = document.createElement('button'); b.textContent = '이 시점으로';
    b.onclick = () => { restoreFrom(k); $('#snapDlg').close(); showBanner(`${k.slice(SNAP.length)} 시점으로 되돌렸어요.`); };
    li.append(b); ul.append(li);
  });
  $('#snapDlg').showModal();
};
$('#snapClose').onclick = () => $('#snapDlg').close();

// ---- 배너 ----
function showBanner(text, btn, fn){
  $('#bannerText').textContent = text;
  const b = $('#bannerBtn'); b.textContent = btn || '닫기';
  b.onclick = () => { $('#banner').classList.remove('show'); fn && fn(); };
  $('#banner').classList.add('show');
}

// ---- 파일 자동 백업 (File System Access, Chrome/Edge) ----
const idb = (() => {
  let p; const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open('faithDiary', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  return {
    get: k => open().then(d => new Promise(res => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); })).catch(() => null),
    set: (k, v) => open().then(d => new Promise(res => { const t = d.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; })).catch(() => {}),
  };
})();
let fileHandle = null, fileReady = false, fileT;
const fsSupported = 'showSaveFilePicker' in window;
function updateFileBtn(){
  const b = $('#btnFile');
  if (!fsSupported) { b.style.display = 'none'; return; }
  b.textContent = fileReady ? `백업 중 · ${fileHandle.name}` : (fileHandle ? '백업 파일 다시 연결' : '백업 파일 연결');
}
async function writeFile(json){
  if (!fileReady) return;
  try { const w = await fileHandle.createWritable(); await w.write(json); await w.close(); }
  catch { fileReady = false; updateFileBtn(); }
}
function scheduleFileBackup(json){ clearTimeout(fileT); fileT = setTimeout(() => writeFile(json), 1500); }
$('#btnFile').onclick = async () => {
  try {
    if (fileHandle && !fileReady) {
      if (await fileHandle.requestPermission({ mode:'readwrite' }) === 'granted') { fileReady = true; updateFileBtn(); writeFile(JSON.stringify(db)); return; }
    }
    fileHandle = await showSaveFilePicker({ suggestedName:'신앙일기-백업.json', types:[{ description:'JSON', accept:{ 'application/json':['.json'] } }] });
    await idb.set('fileHandle', fileHandle);
    fileReady = true; updateFileBtn(); writeFile(JSON.stringify(db, null, 2));
  } catch {}
};
(async () => {
  if (!fsSupported) return updateFileBtn();
  fileHandle = await idb.get('fileHandle');
  if (fileHandle) { try { fileReady = (await fileHandle.queryPermission({ mode:'readwrite' })) === 'granted'; } catch {} }
  updateFileBtn();
})();

// ---- 시작 ----
try { navigator.storage?.persist?.(); } catch {}
load(cur);
if (!Object.keys(db.entries).length) {
  const keys = snapKeys();
  if (keys.length) showBanner('저장된 일기가 비어 있어요. 마지막 복원 지점에서 되살릴 수 있어요.', '복원하기', () => restoreFrom(keys[0]));
}
setStatus('', '쓰는 즉시 저장됩니다');
})();
</script>
